<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement réussi - Hub Auto</title>
  <style>
    body { background: #0a0a0c; font-family: 'DM Sans', sans-serif; color: white; text-align: center; padding: 80px 20px; }
    .box { background: #151517; border: 1px solid #222427; border-radius: 32px; padding: 48px; max-width: 500px; margin: 0 auto; }
    .check { font-size: 64px; color: #e33b2c; margin-bottom: 24px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 16px; }
    p { color: #b3b7c0; margin-bottom: 32px; }
    .btn { background: #e33b2c; color: white; padding: 12px 28px; border-radius: 40px; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
<div class="box">
  <div class="check">✓</div>
  <h1>Paiement accepté !</h1>
  <p>Votre dossier est enregistré. Nos experts vous répondent sous 24h.</p>
  <a href="index.html" class="btn">Retour à l'accueil</a>
</div>

<script>
  // Webhook Google Sheets (remplace par ton URL)
  const WEBHOOK_URL = 'https://script.google.com/macros/s/.../exec';

  const saved = sessionStorage.getItem('hubauto_pending');
  if (saved) {
    const { type, data } = JSON.parse(saved);
    sessionStorage.removeItem('hubauto_pending');

    // Construire le payload (identique à celui du code principal)
    const payload = {
      type: type === 'sell' ? 'VENTE' : 'ACHAT',
      prenom: data.prenom,
      nom: data.nom,
      email: data.email,
      telephone: data.tel,
      localisation: data.localisation || '',
      date: new Date().toLocaleString('fr-FR'),
      nombre_photos: data.photos ? data.photos.length : 0,
      details: type === 'sell' ? {
        marque: data.marque,
        modele: data.modele,
        annee: data.annee,
        km: data.km,
        energie: data.energie,
        boite: data.boite,
        couleur: data.couleur || '',
        etat: data.etat,
        prix: data.prix,
        immat: data.immat || '',
        entretien: data.entretien || '',
        message: data.message || ''
      } : {
        marque: data.marque,
        modele: data.modele,
        energie: data.energie,
        boite: data.boite || 'Indifférent',
        annee_min: data.annee_min,
        annee_max: data.annee_max || '',
        km_max: data.km_max,
        budget: data.budget,
        couleur: data.couleur || '',
        options: data.options || ''
      }
    };

    fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(err => console.error('Erreur envoi Google Sheets', err));
  } else {
    console.log('Aucune donnée trouvée');
  }
</script>
</body>
</html>
